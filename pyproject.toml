[tool.mypy]
python_version = "3.11"

# Search path
mypy_path = ["src"]

# General checks
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

# Useful for ML projects with many third-party libraries
ignore_missing_imports = true

# Disable noisy errors if desired
disable_error_code = [
    "import-untyped",
    "attr-defined",
]

# Exclude generated/build files
exclude = [
    "^build/",
    "^dist/",
    "^.venv/",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"